:project:
  :name: PicoForge Firmware Tests
  :ceedling_version: 1.1.10
  :build_root: build/ceedling
  :use_mocks: TRUE
  :release_build: FALSE

:plugins:
  :enabled:
    - gcov

:cmock:
  :when_ptr: :compare_ptr
  :plugins:
    - ignore
    - ignore_arg
    - expect_any_args
    - return_thru_ptr
    - callback

:gcov:
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
    - Cobertura
  :gcovr:
    :report_root: .

:paths:
  :test:
    - +:firmware/tests/**
    - -:firmware/tests/support
    - -:firmware/tests/support/**
  :source:
    - +:firmware/src/**
    - +:firmware/third_party/embedded-cli/lib/src
    - +:firmware/tests/support/msc
    - +:firmware/third_party/levelx/common/src
  :include:
    - firmware/src/**
    - firmware/third_party/fatfs/source
    - firmware/third_party/embedded-cli/lib/include
  :support:
    - firmware/tests/support

:files:
  :source:
    - -:firmware/src/main.c
    - -:firmware/src/drivers/temperature.c
    - -:firmware/third_party/levelx/common/src/lx_nor_flash_simulator.c

:flags:
  :test:
    :compile:
      :test_board_resources_nor:
        - -DPF_STORAGE_BACKEND_NOR=1
        - -DPF_BOARD_STORAGE_QSPI=0
      :test_board_storage_qspi:
        - -DPF_STORAGE_BACKEND_NOR=1
        - -DPF_BOARD_STORAGE_QSPI=1
      :test_board_storage_spi:
        - -DPF_STORAGE_BACKEND_NOR=1
        - -DPF_BOARD_STORAGE_QSPI=0
      :test_sd_native_init:
        - -DPF_SD_NATIVE_HIGH_SPEED=1
      :test_levelx_nor:
        - -DLX_INCLUDE_USER_DEFINE_FILE
      :test_levelx_block_device:
        - -DLX_INCLUDE_USER_DEFINE_FILE
      :test_nor_media:
        - -DLX_INCLUDE_USER_DEFINE_FILE
        - -DPF_NOR_REGION_OFFSET=4096u
        - -DPF_NOR_REGION_SIZE=32768u
        - -DPF_NOR_QSPI=1
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_sd_media_freertos_serialization:
        - -std=c11
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_sd_media_:
        - -ffunction-sections
        - -fdata-sections
      :/test_sd_media_.*spi/:
        - -DPF_CONFIG_SD_CARD_TRANSPORT=1
      :test_storage_worker_automount:
        - -ffunction-sections
        - -fdata-sections
      :test_storage_worker_nor:
        - -DPF_STORAGE_BACKEND_NOR=1
        - -ffunction-sections
        - -fdata-sections
      :test_storage_commands_nor:
        - -DPF_STORAGE_BACKEND_NOR=1
      :test_fatfs_volume:
        - -std=c11
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_dcd_guard:
        - -D_XOPEN_SOURCE=700
        - -pthread
        - -ffunction-sections
        - -fdata-sections
      :test_sdio_wait_freertos:
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_usb_hid_sd_responsiveness:
        - -DPF_FIRMWARE_VERSION_MAJOR=1u
        - -DPF_FIRMWARE_VERSION_MINOR=2u
        - -DPF_FIRMWARE_VERSION_PATCH=3u
        - -ffunction-sections
        - -fdata-sections
      :test_usb_hid_nor:
        - -DPF_STORAGE_BACKEND_NOR=1
        - -DPF_FIRMWARE_VERSION_MAJOR=0u
        - -DPF_FIRMWARE_VERSION_MINOR=0u
        - -DPF_FIRMWARE_VERSION_PATCH=0u
        - -ffunction-sections
        - -fdata-sections
      :test_usb_msc_batch:
        - -D_XOPEN_SOURCE=700
        - -pthread
        - -ffunction-sections
        - -fdata-sections
      :test_usb_msc_nor:
        - -DPF_STORAGE_BACKEND_NOR=1
      :test_usb_msc_batch_sdio:
        - -DPF_CONFIG_SD_CARD_TRANSPORT=0
      :test_usb_msc_batch_spi:
        - -DPF_CONFIG_SD_CARD_TRANSPORT=1
    :link:
      :test_fatfs_volume:
        - -pthread
      :test_dcd_guard:
        - -pthread
        - -Wl,--gc-sections
      :test_sdio_wait_freertos:
        - -pthread
      :test_nor_media:
        - -pthread
      :test_sd_media_freertos_serialization:
        - -pthread
      :test_sd_media_:
        - -Wl,--gc-sections
      :test_storage_worker_automount:
        - -Wl,--gc-sections
      :test_storage_worker_nor:
        - -Wl,--gc-sections
      :test_usb_hid_sd_responsiveness:
        - -Wl,--gc-sections
      :test_usb_hid_nor:
        - -Wl,--gc-sections
      :test_usb_msc_callbacks:
        - -Wl,--wrap=mscd_reset
        - -Wl,--wrap=mscd_control_xfer_cb
      :test_usb_msc_batch:
        - -pthread
        - -Wl,--gc-sections