:project:
  :name: PicoForge Firmware Tests
  :ceedling_version: 1.1.10
  :build_root: build/ceedling
  :use_mocks: TRUE
  :release_build: FALSE

:plugins:
  :enabled:
    - gcov

:cmock:
  :when_ptr: :compare_ptr
  :plugins:
    - ignore
    - ignore_arg
    - expect_any_args
    - return_thru_ptr
    - callback

:gcov:
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
    - Cobertura
  :gcovr:
    :report_root: .

:paths:
  :test:
    - +:firmware/tests/**
    - -:firmware/tests/support
    - -:firmware/tests/support/**
  :source:
    - +:firmware/src/**
    - +:firmware/third_party/embedded-cli/lib/src
    - +:firmware/tests/support/msc
  :include:
    - firmware/src/**
    - firmware/third_party/fatfs/source
    - firmware/third_party/embedded-cli/lib/include
  :support:
    - firmware/tests/support

:files:
  :source:
    - -:firmware/src/main.c

:flags:
  :test:
    :compile:
      :test_storage_media_freertos_serialization:
        - -std=c11
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_storage_media_:
        - -ffunction-sections
        - -fdata-sections
      :/test_storage_media_.*spi/:
        - -DPF_TEST_SDCARD_TRANSPORT=1
      :test_storage_worker_automount:
        - -ffunction-sections
        - -fdata-sections
      :test_fatfs_volume:
        - -std=c11
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_dcd_guard:
        - -D_XOPEN_SOURCE=700
        - -pthread
        - -ffunction-sections
        - -fdata-sections
      :test_sdio_pio_wait_freertos:
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_usb_hid_sd_responsiveness:
        - -DPF_FIRMWARE_VERSION_MAJOR=1u
        - -DPF_FIRMWARE_VERSION_MINOR=2u
        - -DPF_FIRMWARE_VERSION_PATCH=3u
        - -ffunction-sections
        - -fdata-sections
      :test_usb_hid_benchmark_disabled:
        - -DPF_FIRMWARE_VERSION_MAJOR=1u
        - -DPF_FIRMWARE_VERSION_MINOR=2u
        - -DPF_FIRMWARE_VERSION_PATCH=3u
        - -ffunction-sections
        - -fdata-sections
      :test_usb_hid_wireless:
        - -ffunction-sections
        - -fdata-sections
      :test_usb_msc_batch:
        - -D_XOPEN_SOURCE=700
        - -pthread
        - -ffunction-sections
        - -fdata-sections
      :test_usb_msc_batch_sdio:
        - -DPF_TEST_SDCARD_TRANSPORT=0
      :test_usb_msc_batch_spi:
        - -DPF_TEST_SDCARD_TRANSPORT=1
    :link:
      :test_fatfs_volume:
        - -pthread
      :test_dcd_guard:
        - -pthread
        - -Wl,--gc-sections
      :test_sdio_pio_wait_freertos:
        - -pthread
      :test_storage_media_freertos_serialization:
        - -pthread
      :test_storage_media_:
        - -Wl,--gc-sections
      :test_storage_worker_automount:
        - -Wl,--gc-sections
      :test_usb_hid_sd_responsiveness:
        - -Wl,--gc-sections
      :test_usb_hid_benchmark_disabled:
        - -Wl,--gc-sections
      :test_usb_hid_wireless:
        - -Wl,--gc-sections
      :test_usb_msc_callbacks:
        - -Wl,--wrap=mscd_reset
        - -Wl,--wrap=mscd_control_xfer_cb
      :test_usb_msc_batch:
        - -pthread
        - -Wl,--gc-sections