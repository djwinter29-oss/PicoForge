:project:
  :name: PicoForge Firmware Tests
  :ceedling_version: 1.1.10
  :build_root: build/ceedling
  :use_mocks: TRUE
  :release_build: FALSE

:plugins:
  :enabled:
    - gcov

:cmock:
  :when_ptr: :compare_ptr
  :plugins:
    - ignore
    - ignore_arg
    - expect_any_args
    - return_thru_ptr
    - callback

:gcov:
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
    - Cobertura
  :gcovr:
    :report_root: .

:paths:
  :test:
    - +:firmware/tests/**
    - -:firmware/tests/support
    - -:firmware/tests/support/**
  :source:
    - +:firmware/src/**
    - +:firmware/third_party/embedded-cli/lib/src
    - +:firmware/tests/support/msc
    - +:firmware/third_party/levelx/common/src
  :include:
    - firmware/src/**
    - firmware/third_party/fatfs/source
    - firmware/third_party/embedded-cli/lib/include
  :support:
    - firmware/tests/support

:files:
  :source:
    - -:firmware/src/main.c
    - -:firmware/src/drivers/temperature.c
    - -:firmware/third_party/levelx/common/src/lx_nor_flash_simulator.c

:flags:
  :test:
    :compile:
      :test_sd_native_init:
        - -DPF_SD_NATIVE_HIGH_SPEED=1
      :test_levelx_nor:
        - -DLX_INCLUDE_USER_DEFINE_FILE
      :test_sd_port_serialization:
        - -std=c11
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_sd_port_:
        - -ffunction-sections
        - -fdata-sections
      :/test_sd_port_.*spi/:
        - -DPF_CONFIG_SD_CARD_TRANSPORT=1
      :test_storage_automount:
        - -ffunction-sections
        - -fdata-sections
      :test_usb_sd_responsiveness:
        - -ffunction-sections
        - -fdata-sections
      :test_msc_batch:
        - -D_XOPEN_SOURCE=700
        - -pthread
      :test_msc_batch_sdio:
        - -DPF_CONFIG_SD_CARD_TRANSPORT=0
      :test_msc_batch_spi:
        - -DPF_CONFIG_SD_CARD_TRANSPORT=1
    :link:
      :test_sd_port_serialization:
        - -pthread
      :test_sd_port_:
        - -Wl,--gc-sections
      :test_storage_automount:
        - -Wl,--gc-sections
      :test_usb_sd_responsiveness:
        - -Wl,--gc-sections
      :test_msc_callbacks:
        - -Wl,--wrap=mscd_reset
        - -Wl,--wrap=mscd_control_xfer_cb
      :test_msc_batch:
        - -pthread