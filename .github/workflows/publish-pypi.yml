name: Publish Python to PyPI

'on':
  workflow_run:
    workflows: [Release build packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag in vMAJOR.MINOR.PATCH form"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify released wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(tools/firmware/release-version.sh "$RELEASE_TAG")
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '.isDraft == false and .isPrerelease == false')" = true
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [ -n "$SOURCE_SHA" ]; then
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          fi
          mkdir dist
          gh release download "$RELEASE_TAG" --pattern "picoforge-$version-py3-none-any.whl" \
            --pattern SHA256SUMS.txt --dir dist
          cd dist
          sha256sum --check SHA256SUMS.txt --ignore-missing
          rm SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distribution
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/picoforge/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distribution
          path: dist
      - name: Publish verified release wheel using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
