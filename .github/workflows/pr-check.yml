name: PR Check

'on':
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Check shell script syntax
        run: |
          sh -n tools/firmware/build.sh
          sh -n tools/firmware/load.sh

      - name: Build firmware
        run: tools/firmware/build.sh --board "${{ matrix.board }}"

      - name: Install project test dependencies
        run: python3 -m pip install --requirement tests/requirements.txt

      - name: Run project tests
        run: |
          python3 -m pytest tests/contracts tests/pio tests/test_validation_integrity.py \
            tests/artifacts/test_msc_elf.py \
            --elf "$(cat "build/firmware-${{ matrix.board }}/pico_forge_elf.txt")" \
            --junitxml=build/project-tests.xml

  host-validation:
    name: Host validation
    uses: ./.github/workflows/host-validation.yml