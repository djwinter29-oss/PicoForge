name: Host Validation

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  ceedling-setup:
    name: Ceedling project setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install coverage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3-venv

      - name: Setup Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "3.4"

      - name: Setup and validate Ceedling project
        run: tools/firmware/setup-ceedling-testing.sh help