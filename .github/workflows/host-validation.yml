name: Host Validation

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  host-unit-tests:
    name: Host unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-15
            python: "3.10"
          - os: macos-15
            python: "3.12"
          - os: windows-2025
            python: "3.10"
          - os: windows-2025
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node.js
        if: matrix.python == '3.12'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Check Direct JavaScript types
        if: matrix.python == '3.12'
        run: npx --yes --package typescript@5.9.3 tsc --project host/direct/web/js/tsconfig.json

      - name: Check shared JavaScript boundaries
        if: matrix.python == '3.12'
        run: npx --yes --package typescript@5.9.3 tsc --project host/web/tsconfig.json

      - name: Install dashboard browser test dependencies
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          python -m pip install --disable-pip-version-check --no-input -r host/direct/tests/browser/requirements.txt -r host/web/tests/browser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Direct browser checks
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python host/direct/tests/browser/run.py

      - name: Setup .NET
        if: matrix.python == '3.12'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux HID system dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhidapi-dev

      - name: Install macOS HID system dependency
        if: runner.os == 'macOS'
        run: brew install hidapi

      - name: Install Python host dependencies
        run: python -m pip install --disable-pip-version-check --no-input --editable host/python -r host/python/tests/requirements.txt

      - name: Run host unit tests
        if: matrix.python == '3.12'
        env:
          PYTHON: python
        shell: bash
        run: bash tools/validation/test-host.sh

      - name: Verify installed Python wheel
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          python -m pip wheel --no-deps host/python --wheel-dir build/wheels
          python -m venv build/wheel-check
          build/wheel-check/bin/python -m pip install build/wheels/*.whl
          build/wheel-check/bin/python -I tools/validation/check-python-wheel.py 0.0.0.dev0

      - name: Run shared browser checks through Python and .NET hosting
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python host/web/tests/browser/run.py

      - name: Test minimum Python version
        if: matrix.python == '3.10'
        run: python -m unittest discover -s host/python/tests

  ceedling-setup:
    name: Firmware unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize firmware test dependencies
        run: git submodule update --init firmware/third_party/embedded-cli

      - name: Install coverage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3-venv

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"

      - name: Setup Ceedling and run firmware unit tests
        run: tools/validation/setup-ceedling-testing.sh test:all

      - name: Generate firmware coverage reports
        if: always()
        run: tools/validation/setup-ceedling-testing.sh gcov:all

      - name: Attach firmware coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-coverage
          path: build/ceedling/artifacts/gcov/gcovr/
          if-no-files-found: warn
