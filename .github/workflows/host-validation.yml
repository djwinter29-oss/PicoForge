name: Host Validation

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  host-unit-tests:
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Install Python HID system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhidapi-dev

      - name: Install Python host dependencies
        run: python -m pip install --disable-pip-version-check --no-input --editable host/python

      - name: Run host unit tests
        run: tools/validation/test-host.sh

  ceedling-setup:
    name: Ceedling project setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CLI dependency
        run: git submodule update --init firmware/third_party/embedded-cli

      - name: Install coverage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3-venv

      - name: Setup Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "3.4"

      - name: Setup and validate Ceedling project
        run: tools/validation/setup-ceedling-testing.sh help