name: Release build packages

'on':
  push:
    tags: ["v*.*.*"] # GitHub globs are filtered strictly by the validation job.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          version=$(tools/firmware/release-version.sh "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  host-validation:
    needs: validate-tag
    uses: ./.github/workflows/host-validation.yml

  firmware:
    needs: [validate-tag, host-validation]
    env:
      PF_FIRMWARE_VERSION: ${{ needs.validate-tag.outputs.version }}
    name: Firmware (${{ matrix.board }}, ${{ matrix.clock }} MHz, ${{ matrix.transport }}, ${{ matrix.port }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        board: [pico, pico2]
        clock: [150, 250]
        transport: [SDIO_PIO, SPI]
        port: [FREERTOS, BAREMETAL]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Use commit timestamp for reproducible build dates
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Check shell script syntax
        run: |
          sh -n tools/firmware/release-version.sh
          sh -n tools/firmware/build.sh
          sh -n tools/firmware/load.sh

      - name: Build firmware
        env:
          PF_SDIO_PIO_HIGH_SPEED: "ON"
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: >-
          tools/firmware/build.sh --board "${{ matrix.board }}"
          --sd-card-transport "${{ matrix.transport }}" --sd-card-port "${{ matrix.port }}"
          --sys-clk-mhz "${{ matrix.clock }}" --build-dir build/firmware

      - name: Install project test dependencies
        run: python3 -m pip install --requirement tests/requirements.txt

      - name: Check bare-metal SD port artifacts
        if: matrix.port == 'BAREMETAL'
        run: python3 -m pytest tests/artifacts/test_sd_ports.py --baremetal-build-dir build/firmware

      - name: Run project tests
        if: matrix.port == 'FREERTOS'
        run: |
          python3 -m pytest tests/contracts tests/test_validation_integrity.py \
            tests/artifacts/test_msc_elf.py \
            --elf "$(cat "build/firmware/pico_forge_elf.txt")" \
            --junitxml=build/project-tests.xml

      - name: Run SDIO PIO timing tests
        if: matrix.transport == 'SDIO_PIO' && matrix.port == 'FREERTOS'
        run: python3 -m pytest tests/pio --junitxml=build/pio-timing-tests.xml

      - name: Build SDK-default clock application
        if: matrix.clock == 150 && matrix.transport == 'SDIO_PIO' && matrix.port == 'FREERTOS'
        run: >-
          tools/firmware/build.sh --board "${{ matrix.board }}"
          --sys-clk-mhz 0 --build-dir build/default-clock

      - name: Package firmware outputs
        run: |
          mkdir package
          cp build/firmware/*.elf build/firmware/*.uf2 package/
          cd package
          sha256sum *.elf *.uf2 > SHA256SUMS

      - name: Attach build package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-v${{ needs.validate-tag.outputs.version }}-${{ matrix.board }}-cpu${{ matrix.clock }}-${{ matrix.transport }}-${{ matrix.port }}${{ matrix.transport == 'SDIO_PIO' && '-HS' || '' }}
          path: package/
          if-no-files-found: error
