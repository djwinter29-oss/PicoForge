name: Release build packages

'on':
  push:
    tags: ["v*.*.*"] # GitHub globs are filtered strictly by the validation job.
  workflow_dispatch:
    inputs:
      tag:
        description: "Base tag in vMAJOR.MINOR.PATCH form (preflight does not create a tag or release)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            test "$RELEASE_REF_TYPE" = tag
          fi
          version=$(tools/firmware/release-version.sh "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  host-validation:
    needs: validate-tag
    uses: ./.github/workflows/host-validation.yml

  python:
    needs: [validate-tag, host-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set release package version
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          path = Path("host/python/pyproject.toml")
          text, count = re.subn(r'^version = "[^"]+"$', f'version = "{os.environ["VERSION"]}"',
                                path.read_text(), flags=re.MULTILINE)
          assert count == 1, "Expected one package version"
          path.write_text(text)
          PY
      - name: Build wheel
        run: |
          cp LICENSE host/python/LICENSE
          python -m pip wheel --no-deps host/python --wheel-dir dist
      - name: Verify installed wheel and bundled dashboard
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python -m venv build/wheel-check
          build/wheel-check/bin/python -m pip install dist/*.whl
          cd build
          wheel-check/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          import os
          assert version("picoforge") == os.environ["VERSION"]
          from picoforge.cli import main
          web = files("picoforge").joinpath("web")
          for name in ("index.html", "favicon.svg", "css/dashboard.css",
                       "js/app.mjs", "js/dashboard.mjs"):
              assert web.joinpath(name).is_file(), name
          from picoforge.web import create_app
          client = create_app(monitor=object()).test_client()
          response = client.get("/")
          assert response.status_code == 200
          assert b"PicoForge Diagnostics | Python" in response.data
          PY
          wheel-check/bin/picoforge --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/*.whl
          if-no-files-found: error

  webhid:
    needs: [validate-tag, host-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package standalone WebHID
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir -p build/webhid dist
          cp host/webhid/index.html host/webhid/favicon.svg LICENSE build/webhid/
          cp -r host/webhid/css host/webhid/js build/webhid/
          cd build/webhid
          zip -r "../../dist/picoforge-webhid-v$VERSION.zip" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webhid
          path: dist/*.zip
          if-no-files-found: error

  dotnet:
    needs: [validate-tag, host-validation]
    uses: ./.github/workflows/publish-dotnet.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  firmware:
    needs: [validate-tag, host-validation]
    env:
      PF_FIRMWARE_VERSION: ${{ needs.validate-tag.outputs.version }}
    name: Firmware (${{ matrix.board }}, ${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        board: [pico, pico2]
        transport: [SDIO_PIO, SPI]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Use commit timestamp for reproducible build dates
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1 # v1
        with:
          release: "13.3.Rel1"

      - name: Check shell script syntax
        run: |
          sh -n tools/firmware/release-version.sh
          sh -n tools/firmware/build.sh
          sh -n tools/firmware/load.sh

      - name: Build firmware
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: >-
          tools/firmware/build.sh --board "${{ matrix.board }}"
          --sdcard-transport "${{ matrix.transport }}" --build-dir build/firmware

      - name: Install project test dependencies
        run: python3 -m pip install --requirement tests/requirements.txt

      - name: Run project tests
        run: |
          python3 -m pytest tests/contracts tests/test_validation_integrity.py \
            tests/artifacts/test_msc_elf.py \
            --elf "$(cat "build/firmware/pico_forge_elf.txt")" \
            --junitxml=build/project-tests.xml

      - name: Run SDIO PIO timing tests
        if: matrix.transport == 'SDIO_PIO'
        run: python3 -m pytest tests/pio --junitxml=build/pio-timing-tests.xml

      - name: Package firmware outputs
        run: |
          mkdir package
          cp build/firmware/*.elf build/firmware/*.uf2 package/
          cd package
          sha256sum *.elf *.uf2 > SHA256SUMS

      - name: Attach build package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-v${{ needs.validate-tag.outputs.version }}-${{ matrix.board }}-${{ matrix.transport }}${{ matrix.transport == 'SDIO_PIO' && '-HS' || '' }}
          path: package/
          if-no-files-found: error

  release:
    needs: [validate-tag, firmware, python, webhid, dotnet]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-v*
          path: firmware-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Archive firmware and checksum all assets
        run: |
          for package in firmware-packages/*; do
            (cd "$package" && zip -r "../../dist/$(basename "$package").zip" .)
          done
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoForge ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
