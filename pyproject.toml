[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "contracts: repository contracts and validation regression tests",
    "pio: assembled PIO instruction models (requires pioasm)",
    "artifacts: cross-built firmware artifact tests (requires explicit inputs)",
]
