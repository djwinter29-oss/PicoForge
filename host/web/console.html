<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PicoForge Console | {{ dashboard_type }}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/console.css">
  <script type="module" src="/js/console.mjs"></script>
</head>
<body class="console-page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="PicoForge dashboard">
      <span class="brand-mark">PF</span>
      <span class="brand-copy"><small>{{ dashboard_type }}</small><strong>PicoForge</strong></span>
    </a>
    <div class="connection">
      <span class="connection-light" aria-hidden="true"></span>
      <span>TCP port 2323</span>
    </div>
  </header>

  <main>
    <section class="page-heading">
      <div>
        <h1>Wi-Fi console</h1>
        <p class="console-lede">Only one CLI session is allowed; close other USB or TCP terminals before connecting.
          Traffic is not encrypted.</p>
      </div>
      <div class="actions">
        <label class="console-key" for="console-auth-key">BLE control key
          <input id="console-auth-key" type="password" autocomplete="off" spellcheck="false"
            placeholder="Only if TCP auth is enabled">
        </label>
        <button class="button button-secondary" id="connect" type="button" data-state="disconnected">Connect</button>
      </div>
    </section>

    <section class="console-window" aria-label="CLI session">
      <div class="console-bar">
        <span id="console-status" role="status" aria-live="polite">Disconnected</span>
        <span>Enter runs · Tab completes · ↑/↓ history · Shift+Tab leaves</span>
      </div>
      <pre id="terminal" tabindex="0" role="textbox" aria-label="PicoForge CLI terminal"
        aria-multiline="true" aria-readonly="true"></pre>
    </section>
  </main>
</body>
</html>
