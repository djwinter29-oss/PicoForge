<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct dashboard browser checks</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 1rem; }
    iframe { border: 0; display: block; }
    #results { white-space: pre-wrap; }
    #wireless-fixture { position: absolute; top: 1000px; }
  </style>
</head>
<body>
  <h1>Direct dashboard browser checks</h1>
  <ol id="results" aria-live="polite"></ol>
  <iframe id="dashboard" title="Direct dashboard"></iframe>
  <section id="wireless-fixture">
    <select id="settings-wifi"><option value="0">Disabled</option><option value="1">Enabled</option>
      <option value="configure">Configure</option></select>
    <select id="settings-ble"><option value="0">Disabled</option><option value="1">Enabled</option>
      <option value="configure">Configure</option></select>
    <select id="settings-tcp-cli"><option value="0">Off</option><option value="1">On</option></select>
    <dialog id="wifi-dialog">
      <button id="wifi-scan" type="button">Scan</button>
      <p id="wifi-status"></p>
      <div id="wifi-networks"></div>
      <button id="wifi-other" type="button">Other</button>
      <label id="wifi-manual-label">SSID<input id="wifi-ssid"></label>
      <label id="wifi-password-label">Password<input id="wifi-password"></label>
      <button id="wifi-connect" type="button">Test connection</button>
      <button id="wifi-cancel" type="button">Cancel</button>
    </dialog>
    <dialog id="ble-dialog">
      <p id="ble-status"></p>
      <input id="ble-secret">
      <button id="ble-generate" type="button">Generate</button>
      <button id="ble-copy" type="button">Copy</button>
      <button id="ble-cancel" type="button">Close</button>
    </dialog>
    <p id="wireless-summary"></p>
  </section>
  <script type="module" src="browser-checks.mjs"></script>
</body>
</html>
