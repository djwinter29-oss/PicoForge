[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "picoforge"
version = "0.1.0"
description = "PicoForge HID diagnostics and local status dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.3", "hidapi==0.15.0"]

[project.urls]
Homepage = "https://github.com/djwinter29-oss/PicoForge"
Releases = "https://github.com/djwinter29-oss/PicoForge/releases"
Issues = "https://github.com/djwinter29-oss/PicoForge/issues"

[project.scripts]
picoforge = "picoforge.cli:main"

[tool.setuptools]
package-dir = {"picoforge" = "src/picoforge", "picoforge.web" = "../web", "picoforge.wireless_ui" = "../webhid/js"}
packages = ["picoforge", "picoforge.web", "picoforge.wireless_ui"]

[tool.setuptools.package-data]
"picoforge.web" = ["index.html", "favicon.svg", "css/*.css", "js/*.mjs"]
"picoforge.wireless_ui" = ["wireless-form.mjs"]
