[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "picoforge"
version = "0.0.0.dev0"
description = "PicoForge USB HID control, diagnostics, and local dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Ji Dong"}]
keywords = ["picoforge", "raspberry-pi-pico", "rp2040", "rp2350", "usb", "hid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["Flask==3.1.3", "hidapi==0.15.0"]

[project.urls]
Homepage = "https://github.com/djwinter29-oss/PicoForge"
Documentation = "https://github.com/djwinter29-oss/PicoForge/tree/main/host/python#readme"
Source = "https://github.com/djwinter29-oss/PicoForge"
Releases = "https://github.com/djwinter29-oss/PicoForge/releases"
Issues = "https://github.com/djwinter29-oss/PicoForge/issues"

[project.scripts]
picoforge = "picoforge.cli:main"

[tool.setuptools]
package-dir = {"picoforge" = "src/picoforge", "picoforge.web" = "../web/src"}
packages = ["picoforge", "picoforge.web", "picoforge.reports", "picoforge.hid", "picoforge.dashboard"]

[tool.setuptools.package-data]
"picoforge.web" = ["index.html", "console.html", "favicon.svg", "css/*.css", "js/*.mjs"]

[tool.pyright]
include = ["src/picoforge/dashboard/console.py", "src/picoforge/dashboard/boards.py",
           "src/picoforge/dashboard/models.py", "src/picoforge/dashboard/monitor.py", "tests/types/command_types.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
